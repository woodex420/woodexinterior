name: Reviewed artifact — native application validation
run-name: Candidate application validation — ${{ github.sha }}

# Separate from resolver/committed-lock acceptance. Exact manual opt-in only.
on:
  workflow_dispatch:
    inputs:
      confirm_candidate_only:
        description: Validate reviewed artifact in disposable CI only; no deployment/production/backup
        type: boolean
        default: false
        required: true
  push:
    branches: [arena/8be318a2-woodexinterior]
permissions:
  contents: read
concurrency:
  group: candidate-application-validation-${{ github.ref }}-${{ github.event.head_commit.message == '[woodex-qa:diagnose-artifact] source-only manual QA' && 'diagnostic' || 'full' }}
  cancel-in-progress: false
jobs:
  reviewed-candidate-validation:
    if: >-
      github.ref == 'refs/heads/arena/8be318a2-woodexinterior' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm_candidate_only == true) ||
       (github.event_name == 'push' && github.event.head_commit.message == '[woodex-qa:validate-artifact] source-only manual QA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Source-only guard and synthetic archive contracts (not application acceptance)
        run: |
          node --test tools/release/preflight.test.mjs tools/release/ci-native.test.mjs tools/release/ci-diagnostics.test.mjs tools/release/candidate-validation.test.mjs
          python3 tools/release/reviewed-artifact-contracts
      - name: Retrieve exact reviewed artifact on hosted runner (read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/qa85
          gh api repos/woodex420/woodexinterior/actions/artifacts/13063243998 > .cache/qa85/artifact-metadata.json
          python3 - <<'PY'
          import json
          m=json.load(open('.cache/qa85/artifact-metadata.json'))
          assert m['id']==13063243998 and m['expired'] is False
          assert m['digest']=='sha256:d3ca74419dd0b10053e11386462b19e5fd6fd0f1d6b9b0656bcb3ccdbb06bf91'
          assert m['workflow_run']['id']==41258289481
          assert m['workflow_run']['head_sha']=='176e65e0c7f689af9be8494a8e5d17971ea8671b'
          assert m['workflow_run']['head_branch']=='arena/8be318a2-woodexinterior'
          PY
          if ! gh api repos/woodex420/woodexinterior/actions/artifacts/13063243998/zip > .cache/qa85/reviewed.zip 2> .cache/qa85/download-error.txt; then
            echo '::error::HOLD: reviewed artifact transfer failed; no signed storage URLs or credentials published.'
            exit 2
          fi
      - name: Verify archive bytes, provenance, native evidence and exact source; import only two candidate locks
        run: python3 tools/release/import-reviewed-artifact .cache/qa85/reviewed.zip > .cache/qa85/import-proof.json
      - name: Real Composer install and full configured Unit/Feature/Arch suite on isolated MySQL
        run: bash tools/release/validate-reviewed-candidate.sh
      - name: Curated synthetic QA evidence (no env/database/storage/vendor/archive)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-candidate-validation-${{ github.sha }}
          path: |
            .cache/qa85/results/
            .cache/qa85/import-proof.json
            .cache/qa85/artifact-metadata.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
      - name: Scope — no release or backup approval
        if: always()
        run: |
          printf '%s\n' '## Reviewed-artifact candidate validation only' \
            'Application source:176e65e0c7f689af9be8494a8e5d17971ea8671b; reviewed archive digest pinned and checked.' \
            'Candidate locks are uncommitted and used ONLY in this disposable checkout; no automatic repository adoption.' \
            'No backup/restore, production data, provider egress, merge, deployment or auto-deploy change.' \
            'Any skipped/failed/warning test or missing acceptance evidence remains HOLD.' >> "$GITHUB_STEP_SUMMARY"

  inspect-candidate-failure:
    if: >-
      github.ref == 'refs/heads/arena/8be318a2-woodexinterior' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == '[woodex-qa:inspect-validation] source-only manual QA'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Inspect timeout evidence and replacement dependency identity — read only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in '13065909491:timeout' '13066020494:replacement'; do
            id="${pair%%:*}"; label="${pair#*:}"
            if ! gh api "repos/woodex420/woodexinterior/actions/artifacts/$id/zip" > "$RUNNER_TEMP/qa86-$label.zip" 2> "$RUNNER_TEMP/qa86-download-error.txt"; then
              echo '::error::HOLD: pinned inspection artifact unavailable; no storage URLs published.'
              exit 2
            fi
          done
          python3 - "$RUNNER_TEMP/qa86-timeout.zip" "$RUNNER_TEMP/qa86-replacement.zip" <<'PY'
          import hashlib,json,re,sys,zipfile
          from urllib.parse import urlsplit,urlunsplit
          from pathlib import Path
          archives=[]
          for file,digest in zip(sys.argv[1:],[
              'a1ae79f0d8db6c65b4458da802c772e5e5c177138b546f307f61e66c1f04faa8',
              'b15d36505e85c45c05a462b369e298319439b3afb4b312717ddfb7e8935d7149']):
              p=Path(file);assert p.stat().st_size < 1000000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
              z=zipfile.ZipFile(p);entries=z.infolist()
              assert len(entries)<=128 and len({i.filename for i in entries})==len(entries)
              assert sum(i.file_size for i in entries)<=16000000 and all(i.file_size<=4000000 for i in entries)
              archives.append(z)
          original,replacement=archives
          proof=json.loads(original.read('import-proof.json'))
          assert proof['archiveSha256']=='d3ca74419dd0b10053e11386462b19e5fd6fd0f1d6b9b0656bcb3ccdbb06bf91'
          assert proof['sourceSha']=='176e65e0c7f689af9be8494a8e5d17971ea8671b' and proof['readyForProductionDeployment'] is False
          hashes={}
          for local,source,paired in [
              ('composer.json','locks/root/composer.json','locks/paired/composer.json'),
              ('composer.lock','locks/root/composer.lock','locks/paired/composer.lock'),
              ('platform/composer.json','locks/platform/composer.json','locks/paired/platform/composer.json'),
              ('platform/composer.lock','locks/platform/composer.lock','locks/paired/platform/composer.lock')]:
              data=replacement.read(source);assert data==replacement.read(paired)
              hashes[local]=hashlib.sha256(data).hexdigest()
          identity={'scope':'READ ONLY: byte comparison, not artifact adoption or application acceptance',
              'originalFileSha256':proof['fileSha256'],'replacementFileSha256':hashes,
              'sameDependencyBytes':hashes==proof['fileSha256'],'readyForProductionDeployment':False}
          def notice(title,text):
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title='+title+'::'+text)
          notice('Dependency identity only — NOT acceptance',json.dumps(identity,separators=(',',':')))
          text=original.read('results/tests.log').decode('utf-8',errors='replace')
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          def safe_url(m):
              try:
                  u=urlsplit(m.group());return urlunsplit((u.scheme,u.hostname or '',u.path,'',''))
              except Exception:return '[URL REDACTED]'
          text=re.sub(r'https?://[^\s<>\"\x27]+',safe_url,text)
          text='\n'.join(text.splitlines()[-60:])[-3000:]
          notice('Timeout evidence tail — NOT acceptance','TIMEOUT run41260856560; diagnostic only.\n'+text)
          PY

  first-failure-diagnostic:
    if: >-
      github.ref == 'refs/heads/arena/8be318a2-woodexinterior' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == '[woodex-qa:diagnose-artifact] source-only manual QA'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Source-only guard and synthetic archive contracts (not application acceptance)
        run: |
          node --test tools/release/preflight.test.mjs tools/release/ci-native.test.mjs tools/release/ci-diagnostics.test.mjs tools/release/candidate-validation.test.mjs
          python3 tools/release/reviewed-artifact-contracts
      - name: Retrieve pinned equivalent archive — original dependency hashes additionally enforced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/qa85
          gh api repos/woodex420/woodexinterior/actions/artifacts/13066020494 > .cache/qa85/artifact-metadata.json
          python3 - <<'PY'
          import json
          m=json.load(open('.cache/qa85/artifact-metadata.json'))
          assert m['id']==13066020494 and m['expired'] is False
          assert m['digest']=='sha256:b15d36505e85c45c05a462b369e298319439b3afb4b312717ddfb7e8935d7149'
          assert m['workflow_run']['id']==41258289481
          assert m['workflow_run']['head_sha']=='176e65e0c7f689af9be8494a8e5d17971ea8671b'
          assert m['workflow_run']['head_branch']=='arena/8be318a2-woodexinterior'
          PY
          if ! gh api repos/woodex420/woodexinterior/actions/artifacts/13066020494/zip > .cache/qa85/reviewed.zip 2> .cache/qa85/download-error.txt; then
            echo '::error::HOLD: reviewed artifact transfer failed; no signed storage URLs or credentials published.'
            exit 2
          fi
      - name: Verify archive, provenance, source and original four dependency hashes — diagnostic only
        run: python3 tools/release/import-reviewed-artifact --diagnostic-equivalent .cache/qa85/reviewed.zip > .cache/qa85/import-proof.json
      - name: First failure only on isolated MySQL — NOT a full validation pass
        run: bash tools/release/validate-reviewed-candidate.sh --diagnose-first-failure
      - name: Curated synthetic QA evidence (no env/database/storage/vendor/archive)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-failure-diagnostic-${{ github.sha }}
          path: |
            .cache/qa85/results/
            .cache/qa85/import-proof.json
            .cache/qa85/artifact-metadata.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
      - name: Scope — no release or backup approval
        if: always()
        run: |
          printf '%s\n' '## FIRST-FAILURE DIAGNOSTIC ONLY — NOT application acceptance' \
            'Application baseline:176e65e0c7f689af9be8494a8e5d17971ea8671b plus exact three-file MySQL compatibility fix hashes enforced by importer; reviewed dependency bytes unchanged.' \
            'Candidate locks are uncommitted and used ONLY in this disposable checkout; no automatic repository adoption.' \
            'No backup/restore, production data, provider egress, merge, deployment or auto-deploy change.' \
            'Any skipped/failed/warning test or missing acceptance evidence remains HOLD.' >> "$GITHUB_STEP_SUMMARY"
