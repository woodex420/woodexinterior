name: Platform CI

# P9-000: CI is the place where "verified" means something (docs/17 §12).
#  - `sqlite`  — the fast suite, same as the sandbox loop.
#  - `mysql`   — the suite against MySQL 8.4, where numbering, allocations and period locks behave like Hostinger.
#  - `assets`  — Vite/Tailwind build, uploaded for the Hostinger deploy.
# A composer.lock is not committed yet (see docs/ci/README.md); the job resolves and prints it.

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  tests:
    name: PHP 8.4 · Pest (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, exif, bcmath, pdo_sqlite, sqlite3, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('platform/composer.json', 'platform/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            echo "No composer.lock yet: resolving the latest compatible versions."
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Tests (Pest)
        run: vendor/bin/pest --colors=always

      - name: Code style (Pint)
        run: vendor/bin/pint --test -v

      - name: Static analysis (Larastan level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  mysql:
    name: PHP 8.4 · Pest (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: woodex_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: woodex_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, exif, bcmath, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Tests on MySQL
        run: vendor/bin/pest --colors=always

      - name: Concurrency suite (numbering, allocations, periods)
        if: ${{ hashFiles('platform/tests/Feature/ConcurrencyTest.php') != '' }}
        run: vendor/bin/pest tests/Feature/ConcurrencyTest.php --colors=always

  assets:
    name: Front-end build (Vite + Tailwind 4 + Preline 5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload public/build (for Hostinger uploads)
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: platform/public/build
          retention-days: 14
