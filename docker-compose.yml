# Local MySQL runtime for Woodex OS (P9-000, docs/17 §12).
#
#   docker compose up -d db          # MySQL 8.4 on 127.0.0.1:3306 (woodex / woodex / woodex)
#   docker compose run --rm app composer install
#   docker compose run --rm app php artisan migrate --force
#   docker compose up app            # http://localhost:8000
#
# The same database is what CI's `mysql` job runs the suite against, so a numbering or allocation bug shows up
# here before it reaches Hostinger.

services:
  db:
    image: mysql:8.4
    container_name: woodex-db
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: woodex
      MYSQL_USER: woodex
      MYSQL_PASSWORD: woodex
    ports:
      - '3306:3306'
    volumes:
      - woodex-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uwoodex', '-pwoodex']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: woodex-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: woodex
      DB_USERNAME: woodex
      DB_PASSWORD: woodex
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    ports:
      - '8000:8000'
    volumes:
      - ./platform:/app
      - woodex-storage:/app/storage
    working_dir: /app
    command: >
      sh -c "composer install --no-interaction --prefer-dist --no-progress &&
             php artisan key:generate --force --ansi || true;
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  woodex-db:
  woodex-storage:
